events {
    worker_connections 1024;
}

http {
    upstream backend_pool {
        # Round robin: rotacion entre las tres instancias.
        server app1:5000 max_fails=2 fail_timeout=10s;
        server app2:5000 max_fails=2 fail_timeout=10s;
        server app3:5000 max_fails=2 fail_timeout=10s;
    }

    server {
        listen 80;
        server_name _;

        location = /health {
            default_type text/plain;
            return 200 "nginx ok\n";
        }

        location / {
            proxy_pass http://backend_pool;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 2s;
            proxy_read_timeout 30s;
            proxy_next_upstream error timeout http_502 http_503 http_504;
            proxy_next_upstream_tries 3;
        }
    }

    # Puerto interno para Nginx Prometheus Exporter; NO publicado al host.
    server {
        listen 8088;
        server_name _;
        access_log off;
        location = /stub_status {
            stub_status;
        }
    }
}
